{{- if .Values.bkmonitor.collectEnabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bk-cmdb
spec:
  endpoints:
    - interval: 15s # 采集周期
      path: /metrics # 指标接口路径
      port: http # service的端口名，必须使用端口名，不能使用数字
  namespaceSelector:
    any: true
  selector: # 过滤出需要采集的service
    matchLabels:
      app: bk-cmdb
{{- end }}
